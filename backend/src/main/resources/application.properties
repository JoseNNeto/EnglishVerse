spring.application.name=englishverse

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/db_englishverse?sslmode=disable}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neto}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:englishverse}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (O tradutor Java -> SQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuração de Upload de Arquivos
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Chave secreta para JWT
api.security.token.secret=${API_SECURITY_TOKEN_SECRET:81fd2d4af9e97ecf9d75d728362147e00ce40b2776148391cee8ece482d570be}

# Time zone used by the "Days orbiting" MVP. It may later become configurable per user/class.
app.gamification.zone-id=${APP_GAMIFICATION_ZONE_ID:America/Fortaleza}
